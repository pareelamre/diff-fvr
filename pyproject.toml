[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-fvr"
version = "1.1.1"
description = "Differentiable Fourier Volume Rendering (Diff-FVR & PoU-FVR) for fast biplanar 3D-2D X-ray registration on CPU and GPU"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pareel Amre", email = "pareel.amre@gmail.com" }
]
keywords = [
    "digitally-reconstructed-radiographs",
    "fourier-volume-rendering",
    "3d-2d-registration",
    "spine-surgery",
    "medical-imaging",
    "image-guided-interventions"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "pydicom>=2.4.0",
    "simpleitk>=2.2.0",
    "scikit-image>=0.20.0"
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
gpu = ["torch>=2.0.0", "triton>=2.1.0; sys_platform == 'linux'"]

[project.scripts]
fvr-render = "fvr.cli:main_render"
fvr-register = "fvr.cli:main_register"

[project.urls]
Homepage = "https://github.com/pareelamre/diff-fvr"
Repository = "https://github.com/pareelamre/diff-fvr"
Issues = "https://github.com/pareelamre/diff-fvr/issues"

[tool.setuptools.packages.find]
where = ["src"]
